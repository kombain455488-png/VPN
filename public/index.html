<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Manager</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <div class="card">
        <h1>VPN Manager</h1>
        <p class="muted">Hysteria 2 / Neon / Render</p>

        <div class="section">
            <label>Admin Key</label>
            <input id="adminKey" type="password" placeholder="Введите ADMIN_KEY">
        </div>

        <div class="section">
            <label>Имя пользователя</label>
            <input id="userName" type="text" placeholder="Например: Maks">
        </div>

        <div class="section">
            <label>Срок доступа, дней</label>
            <input id="days" type="number" value="30" min="1" max="3650">
        </div>

        <button onclick="createUser()">Создать пользователя</button>
        <div id="result"></div>
    </div>

    <div class="card">
        <h2>Пользователи</h2>
        <button class="secondary" onclick="loadUsers()">Обновить</button>
        <div id="users"></div>
    </div>
</div>
<script src="/app.js"></script>
</body>
</html>
